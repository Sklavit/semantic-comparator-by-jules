<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Text Comparator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Semantic Text Comparator</h1>

        <div class="model-selector-container">
            <label for="model-selector">Select AI Model:</label>
            <select id="model-selector">
                <option value="on-device">On-Device Model (Gemini Nano)</option>
                <option value="google-api">Google Gemini API (Server-side)</option>
            </select>
        </div>

        <div id="api-key-container" style="display: none;">
            <label for="api-key-input">Google Gemini API Key:</label>
            <input type="password" id="api-key-input" placeholder="Enter your API key">
        </div>

        <div class="container">
            <div class="textarea-container">
                <h2>Text 1</h2>
                <textarea id="text1" placeholder="Enter the first text..."></textarea>
            </div>
            <div class="textarea-container">
                <h2>Text 2</h2>
                <textarea id="text2" placeholder="Enter the second text..."></textarea>
            </div>
        </div>
        <button id="compare-btn">Compare</button>
        <div id="result-container">
            <h2>Comparison Result</h2>
            <div id="result"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
